[project]
name = "projeto-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "LucasBorbaDS", email = "borbalucas33@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "watermark>=2.6.0",
]

[project.scripts]
projeto-python = "projeto_python:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
